group 'com.tuntori.audio_waveform'
version '1.0'

apply plugin: 'com.android.library'

android {
    namespace 'com.tuntori.audio_waveform'
    compileSdk 36

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }

    defaultConfig {
        minSdkVersion 24
    }
}
